<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voucher Redeem</title>

  <!-- QR CODE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f3f4f6;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:25px;
      margin-bottom:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
    }

    h1{
      margin-bottom:10px;
    }

    .subtitle{
      color:gray;
      margin-bottom:25px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
    }

    input, button{
      padding:14px;
      border-radius:12px;
      border:none;
      font-size:16px;
    }

    input{
      border:1px solid #ddd;
    }

    button{
      background:black;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
      transform:scale(1.02);
    }

    .voucher-list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .voucher-card{
      background:white;
      border-radius:20px;
      padding:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.08);
    }

    .voucher-header{
      display:flex;
      justify-content:space-between;
      align-items:start;
      margin-bottom:20px;
    }

    .success{
      color:#16a34a;
      font-size:22px;
      font-weight:bold;
    }

    .serial{
      background:black;
      color:white;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:bold;
    }

    .voucher-info{
      margin-bottom:20px;
    }

    .voucher-info div{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .label{
      color:gray;
    }

    .value{
      font-weight:bold;
    }

    .qr-wrapper{
      background:#f3f4f6;
      border-radius:15px;
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .empty{
      text-align:center;
      color:gray;
      padding:40px;
    }

    @media(max-width:600px){
      h1{
        font-size:28px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- FORM -->
    <div class="card">

      <h1>🎟 Voucher Generator</h1>
      <div class="subtitle">
        Generate voucher QR otomatis
      </div>

      <div class="form-grid">

        <input
          type="number"
          id="discount"
          placeholder="Discount %"
          value="10"
        >

        <input
          type="date"
          id="validUntil"
        >

        <button onclick="generateVoucher()">
          Generate Voucher
        </button>

      </div>

    </div>

    <!-- RESULT -->
    <div class="voucher-list" id="voucherList">

      <div class="empty">
        Belum ada voucher dibuat
      </div>

    </div>

  </div>

<script>

  let vouchers = JSON.parse(localStorage.getItem("vouchers")) || [];

  renderVouchers();

  function generateVoucher(){

    const discount = document.getElementById("discount").value;
    const validUntil = document.getElementById("validUntil").value;

    if(!validUntil){
      alert("Isi tanggal expired dulu brok 😭");
      return;
    }

    const serial =
      "VC-" +
      String(vouchers.length + 1).padStart(5, "0");

    const voucher = {
      serial: serial,
      status: "CLAIM VOUCHER SUCCESS",
      discount: discount + "% OFF",
      validUntil: validUntil,
      createdAt: new Date().toLocaleString()
    };

    vouchers.unshift(voucher);

    localStorage.setItem(
      "vouchers",
      JSON.stringify(vouchers)
    );

    renderVouchers();
  }

  function renderVouchers(){

    const container =
      document.getElementById("voucherList");

    if(vouchers.length === 0){

      container.innerHTML = `
        <div class="empty">
          Belum ada voucher dibuat
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    vouchers.forEach((voucher, index)=>{

      const card = document.createElement("div");

      card.className = "voucher-card";

      card.innerHTML = `
        <div class="voucher-header">

          <div>
            <div class="success">
              ${voucher.status}
            </div>

            <div style="font-size:13px;color:gray;margin-top:5px;">
              ${voucher.createdAt}
            </div>
          </div>

          <div class="serial">
            ${voucher.serial}
          </div>

        </div>

        <div class="voucher-info">

          <div>
            <span class="label">Discount</span>
            <span class="value">${voucher.discount}</span>
          </div>

          <div>
            <span class="label">Valid Until</span>
            <span class="value">${voucher.validUntil}</span>
          </div>

        </div>

        <div class="qr-wrapper">
          <div id="qrcode-${index}"></div>
        </div>
      `;

      container.appendChild(card);

      const qrData = JSON.stringify(voucher);

      new QRCode(
        document.getElementById(`qrcode-${index}`),
        {
          text: qrData,
          width:180,
          height:180
        }
      );

    });

  }

</script>

</body>
</html>
