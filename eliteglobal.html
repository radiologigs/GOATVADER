<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voucher Redemption</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:500px;
  background:#1e293b;
  border-radius:25px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.success{
  color:#22c55e;
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
  text-align:center;
}

.info{
  margin-bottom:15px;
  padding:15px;
  background:#0f172a;
  border-radius:15px;
}

.label{
  color:#94a3b8;
  font-size:14px;
  margin-bottom:5px;
}

.value{
  font-size:18px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

  <div class="success">
    CLAIM VOUCHER SUCCESS
  </div>

  <div class="info">
    <div class="label">Member</div>
    <div class="value" id="member"></div>
  </div>

  <div class="info">
    <div class="label">Voucher</div>
    <div class="value" id="voucher"></div>
  </div>

  <div class="info">
    <div class="label">Serial</div>
    <div class="value" id="serial"></div>
  </div>

  <div class="info">
    <div class="label">Generated</div>
    <div class="value" id="created"></div>
  </div>

  <div class="info">
    <div class="label">Valid Until</div>
    <div class="value" id="valid"></div>
  </div>

</div>

<script>

const params =
  new URLSearchParams(window.location.search);

document.getElementById("member").innerText =
  params.get("member");

document.getElementById("voucher").innerText =
  params.get("voucher");

document.getElementById("serial").innerText =
  params.get("serial");

document.getElementById("created").innerText =
  params.get("created");

document.getElementById("valid").innerText =
  params.get("valid");

</script>

</body>
</html>
