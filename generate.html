<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voucher Redeem</title>

  <!-- QR CODE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      padding:20px;
      color:white;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      padding:25px;
      margin-bottom:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.3);
    }

    h1{
      margin-bottom:10px;
    }

    .subtitle{
      color:#94a3b8;
      margin-bottom:25px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
    }

    input, button, select{
      padding:14px;
      border-radius:12px;
      border:none;
      font-size:16px;
    }

    input{
      border:1px solid #334155;
      background:#0f172a;
      color:white;
    }

    input::placeholder{
      color:#94a3b8;
    }

    select{
      border:1px solid #334155;
      background:#0f172a;
      color:white;
    }

    button{
      background:#2563eb;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
      transform:scale(1.02);
    }

    .voucher-list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .voucher-card{
      background:#1e293b;
      border-radius:20px;
      padding:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.3);
    }

    .voucher-header{
      display:flex;
      justify-content:space-between;
      align-items:start;
      margin-bottom:20px;
    }

    .success{
      color:#22c55e;
      font-size:22px;
      font-weight:bold;
    }

    .serial{
      background:#2563eb;
      color:white;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:bold;
    }

    .voucher-info{
      margin-bottom:20px;
    }

    .voucher-info div{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }

    .label{
      color:#94a3b8;
    }

    .value{
      font-weight:bold;
      text-align:right;
    }

    .qr-wrapper{
      background:#0f172a;
      border-radius:15px;
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .empty{
      text-align:center;
      color:#94a3b8;
      padding:40px;
    }

    @media(max-width:600px){

      h1{
        font-size:28px;
      }

      .voucher-info div{
        flex-direction:column;
        gap:5px;
      }

      .value{
        text-align:left;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <!-- FORM -->
  <div class="card">

    <h1>🎟 GOATVADER</h1>

    <div class="subtitle">
      Orang Tua Voucher Member
    </div>

    <div class="form-grid">

      <!-- NAMA MEMBER -->
      <input
        type="text"
        id="memberName"
        placeholder="Name"
      >

      <!-- DROPDOWN DISKON -->
      <select id="voucherType">

        <option value="10% OFF">
          Voucher 10% OFF
        </option>

        <option value="25% OFF">
          Voucher 25% OFF
        </option>

        <option value="50% OFF">
          Voucher 50% OFF
        </option>

        <option value="FREE SESSION">
          FREE Session
        </option>

      </select>

      <!-- BUTTON -->
      <button onclick="generateVoucher()">
        Generate
      </button>

    </div>

  </div>

  <!-- RESULT -->
  <div class="voucher-list" id="voucherList">

    <div class="empty">
      Nothing here . . .
    </div>

  </div>

</div>

<script>

let vouchers =
  JSON.parse(localStorage.getItem("vouchers")) || [];

renderVouchers();

function formatDate(date){

  const d =
    String(date.getDate()).padStart(2, '0');

  const m =
    String(date.getMonth() + 1).padStart(2, '0');

  const y =
    date.getFullYear();

  return `${d}/${m}/${y}`;
}

function formatTime(date){

  return date.toLocaleTimeString(
    'id-ID',
    {
      hour12:false,
      timeZone:'Asia/Jakarta'
    }
  );
}

function generateVoucher(){

  const memberName =
    document.getElementById("memberName").value;

  const voucherType =
    document.getElementById("voucherType").value;

  if(memberName.trim() === ""){

    alert("Isi nama member dulu brok 😭");

    return;
  }

  // SERIAL NUMBER
  const serial =
    "VC-" +
    String(vouchers.length + 1).padStart(5, "0");

  // CURRENT DATE
  const now = new Date();

  // VALID 30 DAYS
  const validUntil = new Date();

  validUntil.setDate(
    validUntil.getDate() + 30
  );

  const voucher = {

    serial: serial,

    memberName: memberName,

    voucherType: voucherType,

    status: "Golden Voucher Generated Successfully",

    createdAt:
      formatDate(now) +
      " " +
      formatTime(now),

    validUntil:
      formatDate(validUntil)

  };

  vouchers.unshift(voucher);

  localStorage.setItem(
    "vouchers",
    JSON.stringify(vouchers)
  );

  renderVouchers();

  // RESET INPUT
  document.getElementById("memberName").value = "";

}

function renderVouchers(){

  const container =
    document.getElementById("voucherList");

  if(vouchers.length === 0){

    container.innerHTML = `
      <div class="empty">
        Copyright © 2026 Orang Tua Group. All Rights Reserved.
      </div>
    `;

    return;
  }

  container.innerHTML = "";

  vouchers.forEach((voucher, index)=>{

    const card = document.createElement("div");

    card.className = "voucher-card";

    card.innerHTML = `

      <div class="voucher-header">

        <div>

          <div class="success">
            ${voucher.status}
          </div>

          <div style="
            font-size:13px;
            color:#94a3b8;
            margin-top:5px;
          ">
            ${voucher.createdAt}
          </div>

        </div>

        <div class="serial">
          ${voucher.serial}
        </div>

      </div>

      <div class="voucher-info">

        <div>
          <span class="label">Member</span>
          <span class="value">
            ${voucher.memberName}
          </span>
        </div>

        <div>
          <span class="label">Voucher</span>
          <span class="value">
            ${voucher.voucherType}
          </span>
        </div>

        <div>
          <span class="label">Valid Until</span>
          <span class="value">
            ${voucher.validUntil}
          </span>
        </div>

      </div>

      <div class="qr-wrapper">
        <div id="qrcode-${index}"></div>
      </div>

    `;

    container.appendChild(card);

const qrData =
  `https://radiologigs.github.io/GOATVADER/eliteglobal.html?` +

  `member=${encodeURIComponent(voucher.memberName)}` +

  `&voucher=${encodeURIComponent(voucher.voucherType)}` +

  `&serial=${encodeURIComponent(voucher.serial)}` +

  `&created=${encodeURIComponent(voucher.createdAt)}` +

  `&valid=${encodeURIComponent(voucher.validUntil)}`;

    new QRCode(
      document.getElementById(`qrcode-${index}`),
      {
        text: qrData,
        width:180,
        height:180
      }
    );

  });

}

</script>

</body>
</html>
